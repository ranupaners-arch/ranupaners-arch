# Perbarui kartu neofetch (dark_mode.svg / light_mode.svg) tiap hari.
# today.py mengambil statistik lewat GitHub GraphQL API dan menyimpan cache
# baris kode di cache/, lalu hasilnya di-commit balik ke main.
name: README build

on:
  schedule:
    - cron: "0 22 * * *"   # 05:00 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "today.py"
      - "tools/**"
      - "cache/requirements.txt"
      - ".github/workflows/build.yaml"

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Bangun ulang kartu dari tools/build_cards.py
        run: python tools/build_cards.py

      - name: Update stats SVG
        env:
          # PAT (secret ACCESS_TOKEN) diperlukan agar repo privat ikut terhitung;
          # tanpa itu GITHUB_TOKEN tetap mengisi semua angka publik.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ranupaners-arch
        run: python today.py

      - name: Commit
        run: |
          git config user.name "ranupaners-arch"
          git config user.email "ranupaners@gmail.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --cached --quiet && { echo "Tidak ada perubahan"; exit 0; }
          git commit -m "chore(profil): perbarui statistik kartu"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
